services:
  ghostledger:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: /app/data/ghostledger.db
      ALLOW_REMOTE: "${ALLOW_REMOTE:-false}"
    volumes:
      - ghostledger-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ghostledger-data:

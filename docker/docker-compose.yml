services:
  ghostledger:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3001}:3001'
    volumes:
      - ghostledger-data:/app/data
      - ghostledger-secrets:/app/secrets
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: /app/data/ghostledger.db
      GHOSTLEDGER_SECRET_DIR: /app/secrets
      ALLOW_REMOTE: '${ALLOW_REMOTE:-false}'
      OPENAI_API_KEY: '${OPENAI_API_KEY:-}'
      ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY:-}'
      GROQ_API_KEY: '${GROQ_API_KEY:-}'
      OLLAMA_BASE_URL: '${OLLAMA_BASE_URL:-http://host.docker.internal:11434}'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ghostledger-data:
  ghostledger-secrets:

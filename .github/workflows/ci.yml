name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: ./data/ci-migration.db
      ALLOW_REMOTE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install all workspaces from the root lockfile
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Build production bundles
        run: npm run build
      - name: Initialize a disposable migration database
        run: npm run db:migrate
      - name: Run isolated backend tests
        run: npm test
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser workflows against a disposable database
        run: npm run test:e2e
